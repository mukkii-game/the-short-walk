<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Short Walk</title>
<link rel="stylesheet" href="css/style.css?v=20260818j">
</head>
<body>

<canvas id="stage"></canvas>

<!-- HUD。出すのは残り人数と課題番号だけ -->
<div id="hud" class="hidden">
  <div id="count" class="hud-count"></div>
  <div id="round" class="hud-round"></div>
</div>

<div id="toast"></div>
<div id="cue"></div>

<!-- タイトル -->
<div id="panelTitle" class="panel title hidden">
  <div class="sheet">
    <h1 class="bigtitle">THE<br>SHORT<br>WALK</h1>
    <p class="lead">
      ペースメーカーが示すリズムとペースで<br>
      歩きつづけろ
    </p>
    <p class="namelabel">名前を入れてください</p>
    <p class="namewrap"><input id="nameTitle" maxlength="8" class="namein" placeholder="ナマエ"></p>
    <div class="btns">
      <button id="btnStart" class="primary">START</button>
      <button id="btnMulti" disabled>ミンナデ</button>
      <button id="btnVis" class="sub"></button>
      <button id="btnCal2" class="sub small">チョウセイ</button>
    </div>
  </div>
  <div class="credits">
    sprites: <a href="https://lpc.opengameart.org/" target="_blank" rel="noopener">Liberated Pixel Cup</a> (CC-BY-SA 3.0)
    ／ sfx: <a href="https://soundeffect-lab.info/" target="_blank" rel="noopener">効果音ラボ</a>
  </div>
</div>

<!-- ロビー -->
<div id="panelLobby" class="panel hidden">
  <div class="sheet narrow center">
    <h2>ミンナデ アルク</h2>
    <div id="lobbyJoin">
      <p class="lead">ナマエ ヲ イレロ（8モジ マデ）</p>
      <p><input id="nameIn" maxlength="8" class="namein"></p>
      <div class="btns center">
        <button id="btnJoin" class="primary">サンカ</button>
        <button id="btnLeave">モドル</button>
      </div>
    </div>
    <div id="lobbyRoom" class="hidden">
      <ul id="lobbyList" class="lobbylist"></ul>
      <div class="btns center">
        <button id="btnGo" class="primary hidden">ハジメル</button>
        <button id="btnLeave2" class="hidden"></button>
      </div>
    </div>
    <p id="lobbyStatus" class="dim2 lead"></p>
  </div>
</div>

<!-- キャリブレーション -->
<div id="panelCalib" class="panel hidden">
  <div class="sheet narrow">
    <h2>入力遅延の測定</h2>
    <p id="calibMsg"></p>
    <p id="calibVal" class="big"></p>
  </div>
</div>

<!-- 終了 -->
<div id="panelEnd" class="panel hidden">
  <div class="sheet narrow center">
    <h1 id="endTitle"></h1>
    <p id="endLead" class="lead"></p>
    <div class="btns center">
      <button id="btnAgain" class="primary">RETRY</button>
    </div>
  </div>
</div>

<script src="js/util.js?v=20260818j"></script>
<script src="js/lines.js?v=20260818j"></script>
<script src="js/net.js?v=20260818j"></script>
<script src="js/audio.js?v=20260818j"></script>
<script src="js/patterns.js?v=20260818j"></script>
<script src="js/world.js?v=20260818j"></script>
<script src="js/render.js?v=20260818j"></script>
<script src="js/game.js?v=20260818j"></script>
</body>
</html>
